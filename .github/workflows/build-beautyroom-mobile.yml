name: Build Beauty Room mobile from STLuxe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-beautyroom-mobile.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build exact STLuxe mobile mechanics with Beauty Room content
        run: |
          python3 - <<'PY'
          import re, urllib.request, pathlib

          src = urllib.request.urlopen('https://raw.githubusercontent.com/ichAEY/STLuxe/main/mobile-stluxe-current.js').read().decode('utf-8')

          maps = 'https://www.google.com/maps/place/Beauty+Room+by+Esmeralda/@40.1673067,44.5124793,17z/'
          instagram = 'https://www.instagram.com/beautyroom_by_esmeralda/'

          services = [
            ('Маникюр','Педикюр'),
            ('Брови и ресницы','Процедуры для бровей'),
            ('Волосы','Свадебные прически'),
            ('Брови и ресницы','Тридинг бровей'),
            ('Эпиляция','Удаление волос нитью'),
            ('Волосы','Укладка волос'),
            ('Другое','Прокалывание ушей'),
            ('Эпиляция','Шугаринг'),
            ('Волосы','Стрижка волос'),
            ('Эпиляция','Электроэпиляция игловая'),
            ('Волосы','Окрашивание волос'),
            ('Волосы','Уход за волосами восстановление повреждённых волос'),
            ('Волосы','Спа процедура для волос'),
            ('Маникюр','Наращивание ногтей'),
            ('Маникюр','Маникюр + покрытие гельлак'),
            ('Маникюр','Маникюр + покрытие лак'),
            ('Маникюр','Парафинотерапия для рук'),
            ('Косметология','Карбокси терапия'),
            ('Косметология','Ультразвуковая чистка лица'),
            ('Эпиляция','Восковая эпиляция'),
            ('Брови и ресницы','Коррекция формы бровей'),
            ('Волосы','Косы'),
            ('Брови и ресницы','Ламинирование бровей'),
            ('Брови и ресницы','Ламинирование ресниц'),
            ('Макияж','Макияж'),
            ('Маникюр','Маникюр'),
            ('Массаж','Массаж'),
            ('Волосы','Мытье головы шампунем и кондиционирование'),
            ('Волосы','Наращивание волос'),
            ('Брови и ресницы','Наращивание ресниц'),
          ]

          nails = ['manicure_french_soft_pink_design_04.webp','manicure_burgundy_long_glitter_09.webp','manicure_nude_almond_02.webp','manicure_white_almond_03.webp','manicure_black_short_06.webp','manicure_pastel_pink_square_10.webp','manicure_burgundy_short_05.webp','manicure_nude_short_01.webp','manicure_white_square_08.webp','manicure_burgundy_almond_matte_gloss_07.webp']
          hair = ['hair_layered_brunette_02.webp','hair_blonde_layers_03.webp','hair_long_waves_05.webp','hair_braids_box_04.webp','hair_sleek_straight_01.webp','hair_braid_girl_06.webp','hair_blonde_waves_01.webp','hair_ponytail_waves_07.webp','kids_hairstyle_ponytail_01.webp']
          makeup = ['makeup_evening_01.webp','makeup_soft_pink_02.webp','makeup_glow_03.webp']
          salon = ['interior_reception_01.webp','interior_reception_02.webp']

          reviews = [
            ('Aurélie Vagharchak','Excellent service! The team is truly professional and welcoming. I had such a nice and peaceful time. Highly recommended for a high-quality manicure and pedicure'),
            ('Nathalie Nalbandian','Visited Esmeralda to get my nails done for a wedding in Armenia. I found her on Yandex maps as a visitor from America. She did a wonderful job with the Russian gel manicure and pedicure. Cute little beauty salon. I recommend!'),
            ('Анастасия Франкони','Супер уютный небольшой салон. Сделали прекрасный маникюр (гель-лак) и педикюр. В процессе поняла, что хочу еще и брови, мастер нашла время, чтобы все сразу успеть! Все качественно и красиво! Стоимость приятная. К сожалению поздно узнала, что в салоне работает массажист-врач. В следующий раз обязательно и на массаж запишусь. Определённо рекомендую к визиту, но записывайтесь хотя бы за день.'),
            ('Shushan Abrahamyan','Great atmosphere and a very cozy salon. The staff are professional, friendly, and attentive. I was very satisfied with the service and would definitely recommend this salon'),
            ('Leyla Medetova','В восторге от обслуживания и сервиса 🔥 Особенно от хозяйки, приятная женщина и профессионал своего дела! Записывалась на маникюр и педикюр, очень качественно! 10 из 10. Рекомендую. Цены тоже удивили, в соотношении цены и качества! Внутри салона атмосферно, чисто и уютно🤍 желаю салону процветания и успехов!'),
            ('DE GUZMAN, RICA MAE S.','Highly recommended! The nail technician was gentle, detailed, and really knew what she was doing. The salon was clean and relaxing too. I love my beautiful nails now😍🫶🏻'),
            ('Lilith Gulanyan','Очень довольна обслуживанием, теплый прием, лучшие топ мастера 👍 вкусное угощение ..кофе'),
            ('Ксения Курбатова','Делала маникюр и педикюр. Всё очень понравилось. Уютно, чисто, мастер просто супер. Спасибо'),
            ('Anne Madsen','Мы с подругой сделали стрижку, маникюр и педикюр, и очень довольны результатом. Персонал сделал все возможное, чтобы мы чувствовали себя желанными гостями, был невероятно дружелюбен и создал уютную атмосферу. Несмотря на то, что мы не говорим по-армянски, и общение было ограничено, нам было очень приятно там находиться. Если мы когда-нибудь снова приедем в Ереван, обязательно вернемся в этот салон🌸 Большое спасибо!!'),
          ]

          masters = [
            ('nails','Nail-мастер','Маникюр · педикюр',['Маникюр'],nails[:5]),
            ('hair','Парикмахер','Волосы · укладки',['Волосы'],hair[:5]),
            ('brows','Бровист / Lash-мастер','Брови · ресницы',['Брови и ресницы'],[]),
            ('cosmetology','Косметолог','Косметология',['Косметология'],[]),
            ('depilation','Мастер эпиляции','Эпиляция',['Эпиляция'],[]),
            ('makeup','Визажист','Макияж',['Макияж'],makeup),
            ('massage','Массажист','Массаж',['Массаж'],[]),
          ]

          src = re.sub(r"const PHONE='[^']*';", "const PHONE='+37493873617';", src)
          src = re.sub(r"const WHATSAPP_URL='[^']*';", f"const WHATSAPP_URL='{instagram}';", src)
          src = re.sub(r"const YANDEX='[^']*';", f"const YANDEX='{maps}';", src)
          src = re.sub(r"const YANDEX_RU='[^']*';", f"const YANDEX_RU='{maps}';", src)
          src = re.sub(r"const YANDEX_REVIEWS='[^']*';", f"const YANDEX_REVIEWS='{maps}';", src)
          src = re.sub(r"const ROUTE='[^']*';", f"const ROUTE='{maps}';", src)
          src = re.sub(r"const ADDRESS='[^']*';", "const ADDRESS='Zavarian St 1/5, Yerevan';", src)
          src = re.sub(r"const RATING='[^']*';", "const RATING='5,0';", src)
          src = re.sub(r"const RATINGS_COUNT=\d+;", "const RATINGS_COUNT=19;", src)

          service_code = "const SERVICES=[\n" + "\n".join("{cat:%r,title:%r,price:'',desc:''}," % (cat,title) for cat,title in services) + "\n];\n"
          def items(files, alt):
              return ',\n'.join(" {src:%r,alt:%r}" % (f,alt) for f in files)
          gallery_code = "const GALLERY={\n" + "'Салон':[\n" + items(salon,'Интерьер Beauty Room by Esmeralda') + "\n],\n" + "'Ногти':[\n" + items(nails,'Маникюр Beauty Room by Esmeralda') + "\n],\n" + "'Волосы':[\n" + items(hair,'Работа с волосами Beauty Room by Esmeralda') + "\n],\n" + "'Макияж':[\n" + items(makeup,'Макияж Beauty Room by Esmeralda') + "\n]\n};\n"
          portfolio = [nails[0],hair[0],makeup[0],nails[1],hair[1],makeup[1],nails[2]]
          portfolio_code = "const PORTFOLIO=[\n" + ',\n'.join(" {src:%r,alt:%r}" % (f,'Работа Beauty Room by Esmeralda') for f in portfolio) + "\n];\n"
          review_code = "const REVIEW_DATA=[\n" + ',\n'.join("[%r,%r]" % r for r in reviews) + "\n];\n"
          real_review_code = "const REAL_REVIEW_DATA=[\n" + ',\n'.join("[%r,%r]" % r for r in reviews) + "\n];\n"
          master_code = "const MASTERS=[\n" + ',\n'.join("{id:%r,name:%r,role:%r,about:%r,cats:%r,work:%r,reviewNames:[]}" % (mid,name,role,'',cats,work) for mid,name,role,cats,work in masters) + "\n];\n"

          src, n1 = re.subn(r"const SERVICES=\[\];.*?const GALLERY=\{.*?\};\nconst PORTFOLIO=\[", service_code + gallery_code + "const PORTFOLIO=[", src, count=1, flags=re.S)
          src, n2 = re.subn(r"const PORTFOLIO=\[.*?\];\nconst REVIEW_DATA=\[", portfolio_code + "const REVIEW_DATA=[", src, count=1, flags=re.S)
          src, n3 = re.subn(r"const REVIEW_DATA=\[.*?\];\nconst MASTERS=\[", review_code + "const MASTERS=[", src, count=1, flags=re.S)
          src, n4 = re.subn(r"const MASTERS=\[.*?\];\nconst MASTER_AVATAR=", master_code + "const MASTER_AVATAR=", src, count=1, flags=re.S)
          src, n5 = re.subn(r"const REAL_REVIEW_DATA=\[.*?\];\nconst reviewInitial", real_review_code + "const reviewInitial", src, count=1, flags=re.S)
          if not all((n1,n2,n3,n4,n5)):
              raise SystemExit(f'data replacement failed: {n1,n2,n3,n4,n5}')

          src = src.replace("assets/images/salon-reception.webp", "interior_reception_01.webp")
          src = src.replace("assets/images/salon-nail-zone.webp", "interior_reception_02.webp")
          src = src.replace("assets/images/stluxe-about-logo.webp", "interior_reception_02.webp")

          # Visible branding only. Do NOT replace uppercase STLUXE because it is used in JS identifiers.
          src = src.replace('STLuxe', 'Beauty Room')
          src = src.replace('Фото Beauty Room', 'Фото Beauty Room')
          src = src.replace('<h1 class="tn22-title">Beauty Room</h1><div class="tn22-sub">Салон красоты</div>', '<h1 class="tn22-title">Beauty Room</h1><div class="tn22-sub">by Esmeralda</div>')
          src = src.replace('Место, где стиль становится<br>вашей естественной красотой.', 'Салон красоты в самом сердце Еревана.')
          src = src.replace('Ивантеевка,', 'Ереван,')
          src = src.replace('Ивантеевка', 'Ереван')
          src = src.replace('ул. Победы, 16', 'Zavarian St 1/5')
          src = src.replace('Московская область · открыть в Яндекс Картах', 'Открыть в Google Maps')
          src = src.replace('Яндекс Карты', 'Google Maps')
          src = src.replace('Яндекс Картах', 'Google Maps')
          src = src.replace('Яндекс.Карты', 'Google Maps')
          src = src.replace('Услуги и цены', 'Услуги')
          src = src.replace('4,9', '5,0')
          src = src.replace('86 отзывов на Google Maps', '19 отзывов · Google Maps')
          src = src.replace('87 отзывов на Google Maps', '19 отзывов · Google Maps')
          src = src.replace('125 оценок', '19 отзывов')
          src = src.replace('WhatsApp', 'Instagram')
          src = src.replace('+7 (916) 355-22-22', '+374 93 873617')
          src = src.replace('Вт–Вс 10:00–20:00', 'Ежедневно 09:00–20:00')
          src = src.replace('Понедельник — выходной', 'Без выходных')
          src = src.replace('со вторника по воскресенье салон работает с 10:00 до 20:00.', 'салон работает ежедневно с 09:00 до 20:00.')
          src = src.replace('10–20', '09–20')
          src = src.replace('Вт–Вс', 'ежедневно')
          src = src.replace('17</strong><small>услуг', '30</strong><small>услуг')
          src = src.replace('Галерея Beauty Room', 'Галерея Beauty Room')
          src = src.replace('Салон · ногти · волосы', 'Салон · ногти · волосы · макияж')
          src = re.sub(r'src="https://yandex\.ru/map-widget/v1/\?[^\"]+"', 'src="https://www.google.com/maps?q=40.1673067,44.5124793&z=16&output=embed"', src)

          src = src.replace('<div class="tn31-service-price">${s.price}</div><button class="tn31-service-book" type="button" data-book-service>Записаться →</button>', '<button class="tn31-service-book" type="button" data-book-service>Записаться →</button>')
          src = src.replace('<b>${s.title}</b><span>${s.price}</span>', '<b>${s.title}</b><span>Записаться</span>')
          src = re.sub(r'<button class="tn50-book-option is-pending".*?</button>', '', src, flags=re.S)
          src = re.sub(r'<button class="tn22-contact is-pending".*?</button>', '', src, flags=re.S)

          status_js = """function status(){const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Yerevan',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());const get=t=>parts.find(x=>x.type===t)?.value||'';const mins=(+get('hour'))*60+(+get('minute'));const open=mins>=540&&mins<1200;const el=visit.querySelector('#tn22Status'),txt=el.querySelector('.tn22-status-text');txt.textContent=open?'Открыто до 20:00':'Закрыто до 09:00';el.className='tn22-status '+(open?'open':'closed');const hs=hero.querySelector('.tn50-hero-status');if(hs){const main=hs.querySelector('.tn50-hero-status-main'),sub=hs.querySelector('.tn50-hero-status-sub');main.textContent=open?'Открыто':'Закрыто';sub.textContent=open?'до 20:00':'до 09:00';hs.classList.toggle('open',open);hs.classList.toggle('closed',!open)}}status();setInterval(status,60000);"""
          src, ns = re.subn(r"function status\(\)\{.*?\}status\(\);setInterval\(status,60000\);", status_js, src, count=1, flags=re.S)
          if not ns:
              raise SystemExit('status replacement failed')

          src = src.replace('const reviewGroupCount=5;', 'const reviewGroupCount=3;')
          src = src.replace('Мы сделали Beauty Room местом, где можно спокойно доверить свою красоту мастеру.', 'Beauty Room by Esmeralda — салон красоты в Ереване.')
          src = src.replace('Нам важно, чтобы вам было комфортно на каждом этапе: мы внимательно относимся к пожеланиям, ценим аккуратную работу и собираем в одном пространстве мастеров разных направлений.', 'Маникюр, волосы, брови и ресницы, макияж, косметология, эпиляция и массаж — в одном пространстве.')

          if 'const STLUXE_V23_REFINED=true;' not in src:
              raise SystemExit('technical STLUXE identifier was changed')
          if 'const BEAUTY ROOM' in src:
              raise SystemExit('invalid identifier detected')

          for f in nails + hair + makeup + salon:
              if not pathlib.Path(f).exists():
                  raise SystemExit(f'missing image: {f}')

          pathlib.Path('mobile-beautyroom-current.js').write_text(src, encoding='utf-8')

          index = pathlib.Path('index.html').read_text(encoding='utf-8')
          old_loaders = re.findall(r'<script[^>]+src="mobile-beautyroom-current\.js[^\"]*"[^>]*></script>', index)
          for old in old_loaders:
              index = index.replace(old, '')
          loader = '<script defer src="mobile-beautyroom-current.js?v=20260917-stluxe-exact-v3"></script>'
          index = index.replace('</body>', loader + '\n</body>')
          pathlib.Path('index.html').write_text(index, encoding='utf-8')
          PY

          node --check mobile-beautyroom-current.js
          grep -q "Beauty Room" mobile-beautyroom-current.js
          grep -q "Доступно" mobile-beautyroom-current.js
          grep -q "Nathalie Nalbandian" mobile-beautyroom-current.js
          grep -q "manicure_french_soft_pink_design_04.webp" mobile-beautyroom-current.js
          grep -q "interior_reception_01.webp" mobile-beautyroom-current.js

          git config user.name "tanem"
          git config user.email "melikyan.mac@gmail.com"
          git add index.html mobile-beautyroom-current.js
          git commit -m "Use exact STLuxe mobile mechanics for Beauty Room"
          git push
